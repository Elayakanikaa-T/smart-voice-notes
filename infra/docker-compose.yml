version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: smart-voice-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart_voice_notes
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # Redis (Job Queue for BullMQ)
  redis:
    image: redis:7-alpine
    container_name: smart-voice-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Backend REST API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smart-voice-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/smart_voice_notes
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: production_jwt_access_secret_min_32_characters_key!
      JWT_REFRESH_SECRET: production_jwt_refresh_secret_min_32_characters_key!
      STORAGE_DRIVER: local
      STT_PROVIDER: mock
      LLM_PROVIDER: mock
    depends_on:
      - mongodb
      - redis
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network

  # Frontend Web Client
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smart-voice-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:
  redis_data:
  backend_uploads:

networks:
  app-network:
    driver: bridge
